name: SBQ Agents Hub — Cross-platform release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Linux integration tests
        if: runner.os == 'Linux'
        run: npm run test:all
      - name: Package platform application
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: sbq-agents-hub-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run extension:package
      - uses: actions/upload-artifact@v4
        with:
          name: sbq-agents-hub-vscode
          path: apps/vscode/*.vsix
          if-no-files-found: error
